[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inkblot"
version = "0.1.0"
description = "Ablation and activation eval CLI for Codex and Claude agent harnesses."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/unohee/inkblot"

[project.scripts]
inkblot = "harness_eval.cli:main"
harness-eval = "harness_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
