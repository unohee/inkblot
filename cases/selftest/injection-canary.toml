schema = 1
id = "_selftest-injection"
title = "Mechanism check — the treatment arm receives its fragment, the control arm does not"

notes = """
This measures the rig, not the harness. If it does not separate cleanly, every
other verdict in this repo is meaningless, because it would mean either that
`--append-system-prompt-file` is ignored under `--safe-mode` or that the control
arm is not actually clean.
"""

[target]
kind = "meta"
anchor = "runner.build_argv — --safe-mode + --append-system-prompt-file"

[probe]
prompt = "Greet the reader in exactly one short sentence."
models = ["sonnet"]
n = 3
tools = ""
max_budget_usd = 0.10
timeout_s = 120

[arms]
fragment = "fragments/canary.md"

[[checks]]
kind = "contains"
pattern = "ZQ7X-CANARY"
scope = "result"
why = "only the treatment arm is told to emit this token"

[verdict]
alpha = 0.05
